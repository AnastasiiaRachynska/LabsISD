  /api/v1/sync/push:
    post:
      operationId: pushChanges
      tags: [Synchronization]
      summary: Push queued local changes
      description: |
        Applies changes only to records owned by the authenticated user.
        Each accepted change is acknowledged and retries must not duplicate
        effects. Repeating the same request with the same Idempotency-Key must
        not apply its effects more than once. Reusing a key for a different
        request returns 409 Conflict with code IDEMPOTENCY_KEY_CONFLICT.
      x-requirement-ids: [REQ-F-035, REQ-F-037, REQ-F-039]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Per-change results. No result or record crosses user scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version conflict or idempotency-key conflict.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SyncConflictError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/sync/pull:
    get:
      operationId: pullChanges
      tags: [Synchronization]
      summary: Pull server changes
      description: |
        Returns changes and deletion tombstones only for the authenticated user.
        The cursor is opaque and bound to that user. An omitted cursor starts
        synchronization from the beginning. An expired cursor returns 410 Gone
        and requires a full resynchronization.
      x-requirement-ids: [REQ-F-036, REQ-F-039]
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque Sync Cursor previously issued to this authenticated user.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: User-scoped changes and the next Sync Cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          description: Cursor expired; a full resynchronization is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token; JWT sub claim identifies the userId.

  parameters:
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    BookId:
      name: bookId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ChapterId:
      name: chapterId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AssociationId:
      name: associationId
      in: path
      required: true
      description: Stable opaque identifier for an association resource.
      schema:
        type: string
        minLength: 1
    LinkId:
      name: linkId
      in: path
      required: true
      description: Stable opaque identifier for an Entry Link resource.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Page size; default 50, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque collection pagination cursor.
      schema:
        type: string
        minLength: 1
    EntryIdFilter:
      name: entryId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    BookIdFilter:
      name: bookId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    ChapterIdFilter:
      name: chapterId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    TagIdFilter:
      name: tagId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Entity ETag precondition for versioned updates and deletions. If absent,
        the operation returns 428 Precondition Required; if malformed, it returns
        400 Bad Request; if it does not match the current ETag, it returns
        412 Precondition Failed.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required key used to make retries of a push request idempotent.
      schema:
        type: string
        minLength: 1

  headers:
    ETag:
      description: Opaque entity version validator.
      schema:
        type: string
    Location:
      description: URI of the newly created resource.
      schema:
        type: string
        format: uri-reference
      example: /api/v1/entries/entry-123

  schemas:
    EntryType:
      type: string
      enum:
        - Character
        - Scene
        - Plot Idea
        - World-building
        - Dialogue/Phrase
        - General Note

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          writeOnly: true

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          writeOnly: true

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          writeOnly: true

    User:
      type: object
      additionalProperties: false
      required: [userId, email, createdAt]
      properties:
        userId:
          type: string
          minLength: 1
          readOnly: true
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
          readOnly: true

    RegisteredUser:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    TokenResponse:
      type: object
      additionalProperties: false
      required: [tokenType, accessToken, accessTokenExpiresIn, refreshToken, user]
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
          minLength: 1
        accessTokenExpiresIn:
          type: integer
          const: 900
          description: Access-token lifetime in seconds.
        refreshToken:
          type: string
          minLength: 1
        user:
          $ref: '#/components/schemas/User'

    EntryWrite:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          pattern: '\S'
        title:
          type: string
          description: Optional explicit title; blank or omitted uses the REQ-F-003 generated display title.
        entryType:
          $ref: '#/components/schemas/EntryType'

    EntryPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        content:
          type: string
          minLength: 1
          pattern: '\S'
        title:
          type: string
        entryType:
          $ref: '#/components/schemas/EntryType'

    Entry:
      type: object
      additionalProperties: false
      required: [id, version, content, title, displayTitle, entryType, createdAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
        content:
          type: string
          minLength: 1
          pattern: '\S'
        title:
          type: [string, 'null']
        displayTitle:
          type: string
          description: Explicit title or title derived according to REQ-F-003.
          readOnly: true
        entryType:
          $ref: '#/components/schemas/EntryType'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    BookWrite:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          pattern: '\S'
          description: Book title.

    BookPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          pattern: '\S'

    Book:
      type: object
      additionalProperties: false
      required: [id, version, title, createdAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
        title:
          type: string
          minLength: 1
          pattern: '\S'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    ChapterWrite:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          pattern: '\S'
          description: Chapter title; parent is selected by the bookId path parameter.

    ChapterPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          pattern: '\S'

    Chapter:
      type: object
      additionalProperties: false
      required: [id, version, bookId, title, createdAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
        bookId:
          type: string
          minLength: 1
          readOnly: true
        title:
          type: string
          minLength: 1
          pattern: '\S'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    TagWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '\S'
          description: Tag display name.

    TagPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          pattern: '\S'

    Tag:
      type: object
      additionalProperties: false
      required: [id, version, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
          readOnly: true
        version:
          type: integer
          minimum: 1
          readOnly: true
        name:
          type: string
          minLength: 1
          pattern: '\S'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    EntryCollection:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
        nextCursor:
          type: [string, 'null']
    BookCollection:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        nextCursor:
          type: [string, 'null']
    ChapterCollection:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
        nextCursor:
          type: [string, 'null']
    TagCollection:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        nextCursor:
          type: [string, 'null']

    EntryTagAssociationWrite:
      type: object
      additionalProperties: false
      required: [entryId, tagId]
      properties:
        entryId:
          type: string
          minLength: 1
        tagId:
          type: string
          minLength: 1
    EntryTagAssociation:
      type: object
      additionalProperties: false
      required: [id, entryId, tagId]
      properties:
        id:
          type: string
          minLength: 1
          readOnly: true
        entryId:
          type: string
          minLength: 1
        tagId:
          type: string
          minLength: 1
    EntryTagAssociationCollection:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntryTagAssociation'
        nextCursor:
          type: [string, 'null']

    EntryBookAssociationWrite:
      type: object
      additionalProperties: false
      required: [entryId, bookId]
      properties:
        entryId:
          type: string
          minLength: 1
        bookId:
          type: string
          minLength: 1
    EntryBookAssociation:
      type: object
      additionalProperties: false
      required: [id, entryId, bookId, source]
      properties:
        id:
          type: string
          minLength: 1
          readOnly: true
        entryId:
          type: string
          minLength: 1
        bookId:
          type: string
          minLength: 1
        source:
          type: string
          const: direct
          description: Identifies a direct association, distinct from Chapter-derived association.
    EntryBookAssociationCollection:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntryBookAssociation'
        nextCursor:
          type: [string, 'null']

    EntryChapterAssociationWrite:
      type: object
      additionalProperties: false
      required: [entryId, chapterId]
      properties:
        entryId:
          type: string
          minLength: 1
        chapterId:
          type: string
          minLength: 1
    EntryChapterAssociation:
      type: object
      additionalProperties: false
      required: [id, entryId, chapterId, bookId]
      properties:
        id:
          type: string
          minLength: 1
          readOnly: true
        entryId:
          type: string
          minLength: 1
        chapterId:
          type: string
          minLength: 1
        bookId:
          type: string
          minLength: 1
          readOnly: true
    EntryChapterAssociationCollection:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntryChapterAssociation'
        nextCursor:
          type: [string, 'null']

    EntryLinkWrite:
      type: object
      additionalProperties: false
      required: [entryIdA, entryIdB]
      properties:
        entryIdA:
          type: string
          minLength: 1
        entryIdB:
          type: string
          minLength: 1
      description: Entry IDs must be different; link has no label and is symmetric.
    EntryLink:
      type: object
      additionalProperties: false
      required: [id, entryIds]
      properties:
        id:
          type: string
          minLength: 1
          readOnly: true
        entryIds:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            minLength: 1
    EntryLinkCollection:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntryLink'
        nextCursor:
          type: [string, 'null']

    SyncResourceType:
      type: string
      enum:
        - entry
        - book
        - chapter
        - tag
        - entryTagAssociation
        - entryBookAssociation
        - entryChapterAssociation
        - entryLink

    SyncOperation:
      type: string
      enum: [create, update, delete]

    SyncChange:
      oneOf:
        - $ref: '#/components/schemas/SyncCreateChange'
        - $ref: '#/components/schemas/SyncUpdateChange'
        - $ref: '#/components/schemas/SyncDeleteChange'
      discriminator:
        propertyName: operation
        mapping:
          create: '#/components/schemas/SyncCreateChange'
          update: '#/components/schemas/SyncUpdateChange'
          delete: '#/components/schemas/SyncDeleteChange'
      description: userId is not accepted; ownership is derived from the access token.
    SyncCreateChange:
      type: object
      additionalProperties: false
      required: [changeId, resourceType, operation, resource]
      properties:
        changeId:
          type: string
          minLength: 1
        resourceType:
          $ref: '#/components/schemas/SyncResourceType'
        operation:
          type: string
          const: create
        resource:
          type: object
          description: Resource representation must match resourceType.
          additionalProperties: true
    SyncUpdateChange:
      type: object
      additionalProperties: false
      required: [changeId, resourceType, operation, resourceId, baseVersion, resource]
      properties:
        changeId:
          type: string
          minLength: 1
        resourceType:
          $ref: '#/components/schemas/SyncResourceType'
        operation:
          type: string
          const: update
        resourceId:
          type: string
          minLength: 1
        baseVersion:
          type: integer
          minimum: 1
          description: Version the client last read; used to detect conflicts.
        resource:
          type: object
          description: Updated resource representation must match resourceType.
          additionalProperties: true
    SyncDeleteChange:
      type: object
      additionalProperties: false
      required: [changeId, resourceType, operation, resourceId, baseVersion]
      properties:
        changeId:
          type: string
          minLength: 1
        resourceType:
          $ref: '#/components/schemas/SyncResourceType'
        operation:
          type: string
          const: delete
        resourceId:
          type: string
          minLength: 1
        baseVersion:
          type: integer
          minimum: 1
          description: Version the client last read; used to detect conflicts.

    SyncPushRequest:
      type: object
      additionalProperties: false
      required: [changes]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'

    SyncChangeResult:
      type: object
      additionalProperties: false
      required: [changeId, status, resourceId]
      properties:
        changeId:
          type: string
        status:
          type: string
          const: acknowledged
        resourceId:
          type: string
        version:
          type: integer
          minimum: 1
    SyncPushResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncChangeResult'

    SyncPullChange:
      type: object
      additionalProperties: false
      required: [resourceType, resourceId, operation, version]
      properties:
        resourceType:
          $ref: '#/components/schemas/SyncResourceType'
        resourceId:
          type: string
          minLength: 1
        operation:
          $ref: '#/components/schemas/SyncOperation'
        version:
          type: integer
          minimum: 1
        resource:
          type: object
          description: Present for create/update; omitted for deletion tombstones.
          additionalProperties: true
    SyncPullResponse:
      type: object
      additionalProperties: false
      required: [changes, nextCursor]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncPullChange'
        nextCursor:
          type: string
          minLength: 1

    Error:
      type: object
      additionalProperties: true
      required: [type, title, status, code, detail]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        requestId:
          type: string
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    SyncConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          oneOf:
            - required: [code, conflict]
              properties:
                code:
                  type: string
                  const: VERSION_CONFLICT
                conflict:
                  type: object
                  additionalProperties: true
                  required: [changeId, localVersion, serverVersion]
                  properties:
                    changeId:
                      type: string
                    localVersion:
                      type: object
                      additionalProperties: true
                    serverVersion:
                      type: object
                      additionalProperties: true
            - required: [code, idempotencyKey]
              properties:
                code:
                  type: string
                  const: IDEMPOTENCY_KEY_CONFLICT
                idempotencyKey:
                  type: string
                  minLength: 1

  responses:
    BadRequest:
      description: Malformed request or invalid parameter.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: BAD_REQUEST
            detail: The request is malformed or contains an invalid parameter.
    Unauthorized:
      description: Missing, invalid, or expired credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            code: UNAUTHENTICATED
            detail: A valid access token is required.
    Forbidden:
      description: Resource or referenced record is outside the authenticated user's scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            code: FORBIDDEN
            detail: You do not have permission to access this resource.
    NotFound:
      description: Resource or parent was not found in the authenticated user's scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: NOT_FOUND
            detail: The requested resource was not found.
    DuplicateRelationship:
      description: Duplicate relationship or invalid self-link.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: DUPLICATE_RELATIONSHIP
            detail: The relationship already exists or the link is invalid.
    VersionConflict:
      description: Supplied resource version is stale.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: VERSION_CONFLICT
            detail: The resource has changed since the supplied version.
    PreconditionFailed:
      description: If-Match does not match the current ETag.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Precondition Failed
            status: 412
            code: PRECONDITION_FAILED
            detail: The If-Match value does not match the current resource version.
    PreconditionRequired:
      description: Required If-Match header is missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Precondition Required
            status: 428
            code: PRECONDITION_REQUIRED
            detail: The If-Match header is required for this operation.
    UnsupportedMediaType:
      description: Request body must use UTF-8 JSON.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Unsupported Media Type
            status: 415
            code: UNSUPPORTED_MEDIA_TYPE
            detail: The request body must use UTF-8 JSON.
    ValidationError:
      description: Request body is valid JSON but violates schema or domain rules.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: VALIDATION_ERROR
            detail: One or more request fields failed validation.
    InternalError:
      description: Unexpected server failure.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            code: INTERNAL_ERROR
            detail: The server encountered an unexpected error.
    ServiceUnavailable:
      description: Service temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            code: SERVICE_UNAVAILABLE
            detail: The service is temporarily unavailable; try again later.

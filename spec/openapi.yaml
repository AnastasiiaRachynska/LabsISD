openapi: 3.1.0
info:
  title: Writer's Creative Ideas Information System API
  version: 1.0.0
  summary: REST API for managing creative writing resources and synchronization.
  description: |
    OpenAPI contract for functional requirements REQ-F-030 through REQ-F-039.
    Chapter paths follow Addendum 01 and are nested below their parent Book.
    Authentication and user-scoped isolation follow Addendum 02.

    Protected resource, relationship, profile, and sync operations require a
    valid bearer access token. The server derives ownership from the verified
    JWT subject (userId); clients must not supply userId to select ownership.
    Data, relationships, sync changes, acknowledgements, and cursors are
    isolated to the authenticated user. Cross-user access returns 403.

    API contract rules, including pagination, conditional updates, idempotent
    synchronization, cursor expiry, and Tag deletion effects, are defined by
    the relevant operation descriptions, parameters, schemas, and responses below.
  contact:
    name: Project API maintainers
  x-requirement-ids:
    - REQ-F-030
    - REQ-F-031
    - REQ-F-032
    - REQ-F-033
    - REQ-F-034
    - REQ-F-035
    - REQ-F-036
    - REQ-F-037
    - REQ-F-038
    - REQ-F-039
servers:
  - url: /
    description: Host-relative base path; each operation path includes the /api/v1 prefix.
tags:
  - name: Authentication
    description: Registration, login, token refresh, and current-user profile.
  - name: Entries
    description: Creative idea entries.
  - name: Books
    description: Writer's book projects.
  - name: Chapters
    description: Chapters nested under a parent Book (Addendum 01).
  - name: Tags
    description: User-defined labels for Entries.
  - name: Associations
    description: Relationships between Entries and domain resources.
  - name: Entry Links
    description: Unlabeled symmetric relationships between Entries.
  - name: Synchronization
    description: User-scoped offline change push and pull.
security:
  - bearerAuth: []

paths:
  /api/v1/auth/register:
    post:
      operationId: registerAccount
      tags: [Authentication]
      summary: Register an account
      description: Creates an account using email and password. Does not log in the user.
      x-requirement-ids: [REQ-F-038]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email is already registered.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: EMAIL_ALREADY_REGISTERED
                detail: An account with this email address already exists.
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Authenticate and obtain tokens
      description: Authenticates email and password and returns an access token and refresh token.
      x-requirement-ids: [REQ-F-038]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/refresh:
    post:
      operationId: refreshTokens
      tags: [Authentication]
      summary: Refresh authentication tokens
      description: Exchanges a valid refresh token for a new access token and refresh token.
      x-requirement-ids: [REQ-F-038]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed; a new refresh token is issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Authentication]
      summary: Get the authenticated user's profile
      x-requirement-ids: [REQ-F-038, REQ-F-039]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
